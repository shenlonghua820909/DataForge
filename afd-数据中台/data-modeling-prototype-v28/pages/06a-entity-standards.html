// ============ 渲染分类树 ============
function renderTree() {
  const tb = document.getElementById('tree-body');
  tb.innerHTML = categories.map(c => {
    const ents = entities.filter(e => e.category === c.id);
    return `<div class="tree-cat" data-cat="${c.id}">
      <div class="tree-cat__head" onclick="toggleCat('${c.id}')">
        <span class="ico">${c.icon}</span><span>${c.name}</span>
        <span class="tree-cat__count">${ents.length}</span>
        <span class="arrow">▸</span>
      </div>
      <div class="tree-cat__items" style="display:none;">
        ${ents.map(e => `<div class="tree-entity" data-entity="${e.code}" onclick="selectEntity('${e.code}')">
          <span class="ico">${e.icon}</span><span style="font-family:var(--font-mono);">${e.code}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
  // 默认展开第一个分类
  const first = document.querySelector('.tree-cat');
  if (first) first.classList.add('open'), first.querySelector('.tree-cat__items').style.display = 'block';
}

function toggleCat(catId) {
  const cat = document.querySelector(`.tree-cat[data-cat="${catId}"]`);
  if (!cat) return;
  cat.classList.toggle('open');
  cat.querySelector('.tree-cat__items').style.display = cat.classList.contains('open') ? 'block' : 'none';
}

// ============ 渲染列表 ============
function renderList(filter = '') {
  const f = filter.toLowerCase();
  const filtered = entities.filter(e =>
    !f || e.code.toLowerCase().includes(f) || e.cn.includes(f) || e.en.toLowerCase().includes(f)
  );
  document.getElementById('list-count').textContent = filtered.length;
  document.getElementById('list-body').innerHTML = filtered.map(e => `
    <div class="list-item ${currentEntity?.code === e.code ? 'active' : ''}" data-entity="${e.code}" onclick="selectEntity('${e.code}')">
      <div class="list-item__head">
        <span class="list-item__ico">${e.icon}</span>
        <span class="list-item__name">${e.code}</span>
        <span class="list-item__cn">${e.cn}</span>
        <span class="list-item__pill">${e.version}</span>
      </div>
      <div class="list-item__meta">
        <span>字段 <b>${e.fields.length}</b></span>
        <span>引用 <b>${e.refs}</b> 表</span>
        <span>负责人 <b>${e.owner}</b></span>
      </div>
    </div>
  `).join('');
}

function filterList() { renderList(document.getElementById('list-search').value); }

// ============ 详情 ============
function selectEntity(code) {
  currentEntity = entities.find(e => e.code === code);
  // 同步列表高亮
  document.querySelectorAll('.list-item').forEach(el => {
    el.classList.toggle('active', el.dataset.entity === code);
  });
  document.querySelectorAll('.tree-entity').forEach(el => {
    el.classList.toggle('active', el.dataset.entity === code);
  });
  if (!currentEntity) return;
  const e = currentEntity;
  document.getElementById('detail-head').innerHTML = `
    <div class="detail__title"><span class="ico">${e.icon}</span> ${e.code} <span style="font-size:13px; color:var(--neutral-500); font-weight:400; font-family:var(--font-mono);">${e.en}</span></div>
    <div class="detail__sub">${e.cn} · v${e.version.slice(1)} · 状态：<span class="pill pill--pub" style="margin-left:4px;">${e.status}</span></div>
  `;
  document.getElementById('detail-body').innerHTML = renderDetailBody();
}

// ============ MARC 字段集 Tab ============
function renderMarcTab() {
  const e = currentEntity;
  const marc = e.marcFields || [];
  if (marc.length === 0) {
    return '<div style="text-align:center; padding:40px; color:var(--neutral-500); font-size:13px;">本实体未维护 MARC 字段集</div>';
  }
  // 按 tag 数字分组
  const groups = {};
  marc.forEach(m => {
    const t = m.tag;
    let g = t === 'LDR' ? '00-头标' :
            t.startsWith('9') ? '9X-本馆' :
            (t[0] + 'XX');
    if (!groups[g]) groups[g] = [];
    groups[g].push(m);
  });
  // 过滤
  const q = (currentMarcFilter || '').toLowerCase();
  const filtered = q
    ? marc.filter(m => m.tag.toLowerCase().includes(q) || m.name.toLowerCase().includes(q) || (m.desc || '').toLowerCase().includes(q))
    : marc;
  return `
    <div style="font-size: 12px; color: var(--neutral-600); line-height: 1.6; margin-bottom: 12px; padding: 8px 12px; background: #F0F9FF; border-radius: 6px; border-left: 3px solid var(--brand-500);">
      <b>${e.code}</b> 实体的 MARC 字段集（共 <b>${marc.length}</b> 个字段）— 参照 MARC21 for Bibliographic Data（包含 0XX 控制/号码、1XX 主要款目、2XX 题名出版、3XX 载体形态、4XX 丛编、5XX 附注、6XX 主题、7XX 附加款目、8XX 丛编附加、9XX 本馆扩展）。点击任意字段查看完整的子字段、指示符和示例。
    </div>
    <div class="prop-grid" style="margin-bottom: 12px;">
      <div class="prop-row" style="grid-column: span 2; border:none;">
        <span class="k">过滤</span>
        <span class="v" style="font-family: var(--font-sans, sans-serif);"><input class="list__search" placeholder="按 tag/名称/说明过滤" value="${currentMarcFilter}" oninput="setMarcFilter(this.value)" style="width: 280px;"></span>
      </div>
    </div>
    <div class="marc-group">
      ${Object.entries(groups).map(([gName, items]) => {
        const visible = items.filter(m => filtered.includes(m));
        if (visible.length === 0) return '';
        return `
          <div class="marc-group__head">
            <span>${gName}</span>
            <span class="marc-group__count">${visible.length} 个字段</span>
          </div>
          <table class="field marc">
            <thead><tr><th style="width: 60px;">Tag</th><th style="width: 180px;">名称</th><th style="width: 50px;">指示符</th><th style="width: 60px;">子字段</th><th>说明</th></tr></thead>
            <tbody>
              ${visible.map(m => `
                <tr class="clickable" onclick="showFieldDetail('${m.tag}')">
                  <td class="text-mono" style="color: var(--brand-700); font-weight: 600;">${m.tag}</td>
                  <td><b>${m.name}</b></td>
                  <td>${m.i1 ? '<span class="ind-pill" title="指示符 1">I1:' + (Array.isArray(m.i1) ? m.i1.join(' ') : m.i1) + '</span>' : ''}${m.i2 ? '<span class="ind-pill" title="指示符 2">I2:' + (Array.isArray(m.i2) ? m.i2.join(' ') : m.i2) + '</span>' : ''}</td>
                  <td class="text-mono" style="color: var(--neutral-600);">${m.subfields.length}${m.repeat === 'R' ? ' <span class="pill pill--code" style="font-size: 9px;">R</span>' : ''}</td>
                  <td style="color: var(--neutral-500); font-size: 11px;">${(m.desc || '').slice(0, 60)}${(m.desc || '').length > 60 ? '...' : ''}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }).join('')}
    </div>
  `;
}

function showFieldDetail(tag) {
  const e = currentEntity;
  const m = (e.marcFields || []).find(x => x.tag === tag);
  if (!m) return;
  const ind1Val = Array.isArray(m.i1) ? m.i1.join(' / ') : (m.i1 || '');
  const ind2Val = Array.isArray(m.i2) ? m.i2.join(' / ') : (m.i2 || '');
  const isRepeat = m.repeat === 'R';
  const body = `
    <div class="fd">
      <div class="fd__head">
        <div class="fd__tag">${m.tag}</div>
        <div class="fd__name">
          <div class="fd__name-cn">${m.name}</div>
          ${isRepeat ? '<span class="pill pill--code" style="margin-top:4px;">可重复 (R)</span>' : '<span class="pill pill--pub" style="margin-top:4px;">不可重复 (NR)</span>'}
        </div>
      </div>
      <div class="fd__desc">${m.desc || '—'}</div>
      ${(ind1Val || ind2Val) ? `
        <div class="fd__ind">
          <div class="fd__ind-block">
            <div class="fd__ind-label">指示符 1 (Ind 1)</div>
            <div class="fd__ind-vals">${ind1Val || '— 未定义 —'}</div>
          </div>
          <div class="fd__ind-block">
            <div class="fd__ind-label">指示符 2 (Ind 2)</div>
            <div class="fd__ind-vals">${ind2Val || '— 未定义 —'}</div>
          </div>
        </div>
      ` : ''}
      ${m.subfields && m.subfields.length > 0 ? `
        <div class="fd__section">
          <div class="fd__section-title">子字段 (${m.subfields.length})</div>
          <table class="fd__sf">
            <thead><tr><th>代码</th><th>名称</th><th>类型</th><th>重复</th><th>说明</th></tr></thead>
            <tbody>
              ${m.subfields.map(s => `
                <tr>
                  <td class="text-mono" style="color: var(--brand-700); font-weight: 600;">$${s.c}</td>
                  <td><b>${s.n}</b></td>
                  <td class="text-mono" style="color: var(--neutral-500); font-size: 11px;">${s.t || '—'}</td>
                  <td>${s.r === 'R' ? '<span class="pill pill--code" style="font-size:9px;">R</span>' : '<span class="pill pill--pub" style="font-size:9px;">NR</span>'}</td>
                  <td style="color: var(--neutral-500); font-size: 11px;">${s.d || '—'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      ` : '<div class="fd__section" style="color: var(--neutral-500); font-size: 12px; padding: 8px 0;">本字段为定长字段，无子字段</div>'}
      ${m.example ? `
        <div class="fd__section">
          <div class="fd__section-title">示例</div>
          <div class="fd__example">${m.example}</div>
        </div>
      ` : ''}
      <div class="fd__section">
        <div class="fd__section-title">本馆映射</div>
        <div class="fd__mapping">${e.code}.${m.tag.toLowerCase()} <span style="color: var(--neutral-500);">· 对应 MARC 字段 ${m.tag}（${m.name}）· 通过 ODPS ods_marc_raw 解析回填</span></div>
      </div>
      <div class="fd__actions">
        <button class="btn btn--sm" onclick="DF.stdModals.copy('020$a — International Standard Book Number', 'MARC 标签')">📋 复制标签</button>
        <button class="btn btn--sm" onclick="DF.stdModals.fieldStats('020$a')">📊 引用统计</button>
        <button class="btn btn--sm btn--primary" onclick="DF.stdModals.submitRevision('020$a → std_bib_isbn')">✏️ 提交修订</button>
      </div>
    </div>
  `;
  DF.app.modal({
    title: `字段详情 · ${e.code} · ${m.tag} ${m.name}`,
    body,
    width: 720,
  });
}

// 初始化
renderTree();
renderList();
// 如果 URL 有 ?entity=xxx 则默认选中
const params = new URLSearchParams(location.search);
if (params.get('entity')) selectEntity(params.get('entity'));
</script>
