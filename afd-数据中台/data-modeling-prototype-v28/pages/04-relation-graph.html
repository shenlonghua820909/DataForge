<style>
  body { overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  .canvas-wrap { position: relative; flex: 1; background: #FAFBFD; overflow: auto; }
  .canvas-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(30,102,245,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(30,102,245,.035) 1px, transparent 1px); background-size: 24px 24px; background-position: 0 0; min-width: 1700px; min-height: 1300px; }

  .node:hover { box-shadow: 0 8px 24px rgba(15,23,42,.12); }
  .node--active { border-color: var(--brand-500); box-shadow: 0 0 0 3px rgba(30,102,245,.12), 0 8px 24px rgba(15,23,42,.12); z-index: 10; }
  .node--dwd { border-color: rgba(30,102,245,.4); }
  .node--dwt { border-color: rgba(245,158,11,.4); }
  .node__head { padding: 8px 10px; border-bottom: 1px solid var(--neutral-100); display: flex; align-items: center; gap: 4px; font-size: 12px; border-radius: 6px 6px 0 0; }
  .node--dwd .node__head { background: rgba(30,102,245,.08); color: var(--ent-detail); }
  .node--dwt .node__head { background: rgba(245,158,11,.1); color: var(--ent-summary); }
  .node__head-icon { width: 14px; height: 14px; }
  .node__head-name { font-family: var(--font-mono); font-weight: 600; color: var(--neutral-800); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; letter-spacing: -0.2px; }
  .node__head-count { font-size: 9px; color: var(--neutral-500); padding: 1px 5px; background: var(--neutral-100); border-radius: 3px; flex-shrink: 0; }
  .node__body { padding: 2px 0; max-height: 220px; overflow-y: auto; }
  .node__field { padding: 3px 10px; font-size: 11px; display: flex; align-items: center; gap: 4px; color: var(--neutral-700); }
  .node__field-pk { color: var(--brand-700); font-weight: 600; }
  .node__field-fk { color: var(--info-500); }
  .node__field--more { color: var(--neutral-400); font-style: italic; padding: 3px 10px; font-size: 10px; }
  .sticky { position: absolute; background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%); border-radius: 4px; padding: 12px; width: 180px; font-size: 12px; color: #78350F; box-shadow: 0 2px 6px rgba(0,0,0,.08); transform: rotate(-2deg); cursor: move; user-select: none; }
  .toolbar-btn { width: 32px; height: 32px; display: grid; place-items: center; border: none; background: transparent; border-radius: 6px; color: var(--neutral-600); cursor: pointer; transition: all .15s; }
  .toolbar-btn:hover { background: var(--neutral-100); color: var(--neutral-900); }
  .toolbar-btn.active { background: var(--brand-50); color: var(--brand-600); }
  .zoom-btn { min-width: 28px; height: 28px; padding: 0 6px; display: inline-grid; place-items: center; border: 1px solid var(--neutral-200); background: #fff; border-radius: 6px; font-size: 12px; cursor: pointer; }

<script>
const state = {
  nodes: [],
  links: [],
  stickies: [],
  selected: null,
  zoom: 1,
  history: [],
  historyIdx: -1,
  showStickies: false,  // v27: 默认隐藏便签
  showCrossLayer: false, // 默认隐藏跨层冗余关系
};

// ====== 节点尺寸常量（与 CSS .node width 一致）======
const NODE_W = 200;       // 节点宽度
const NODE_H = 156;       // 节点固定高度（5 字段 + header + footer）
const NODE_HEAD_H = 34;   // 头部高度
const NODE_FIELD_H = 20;  // 每个字段行高
const NODE_FOOTER_H = 14; // +N more 行高
const MAX_FIELDS_SHOW = 5; // 最多显示前 5 个字段

// 节点中心 Y（固定）
function nodeCenterY(n) {
  return n.y + NODE_H / 2;
}

// 节点内某字段的绝对 Y（节点 y + 字段偏移）
function fieldY(node, table, fieldName) {
  if (!fieldName || !table || !table.fields) return -1;
  const idx = (table.fields || []).findIndex(f => f.name === fieldName);
  if (idx < 0 || idx >= MAX_FIELDS_SHOW) return -1;
  return node.y + NODE_HEAD_H + idx * NODE_FIELD_H + NODE_FIELD_H / 2;
}

// ====== Swimlane 布局：按 layer 分列 ====//
// 列定义：4 段 swimlane（四层口径 ODS/DWD/DWT/ADS）。节点宽 200，层宽按内容自适应。
// 3 个跨层通道（colGap）用于承载跨多层连线（顶层 + 底部绕行）。
const LANE_DEFS = [
  { key: 'ods', x: 20,   w: 350, label: 'ODS · 原始数据层', color: '#8B5CF6', bg: 'rgba(139, 92, 246, 0.04)', border: 'rgba(139, 92, 246, 0.25)' },
  { key: 'dwd', x: 420,  w: 470, label: 'DWD · 明细层（含宽表 / 维度主档）', color: '#1E66F5', bg: 'rgba(30, 102, 245, 0.05)', border: 'rgba(30, 102, 245, 0.25)' },
  { key: 'dwt', x: 940,  w: 400, label: 'DWT · 主题汇总层', color: '#F59E0B', bg: 'rgba(245, 158, 11, 0.06)', border: 'rgba(245, 158, 11, 0.25)' },
  { key: 'ads', x: 1390, w: 290, label: 'ADS · 应用层', color: '#E5484D', bg: 'rgba(229, 72, 77, 0.05)', border: 'rgba(229, 72, 77, 0.25)' },
];
const LANE_X = Object.fromEntries(LANE_DEFS.map(l => [l.key, l.x]));

// 跨层通道定义：两个泳道间预留的水平走廊（中央 X），用于夸 1 层以上连线路由
const LANE_GAPS = [
  { from: 'ods', to: 'dwd', x: 395 },   // ODS ↔ DWD 之间
  { from: 'dwd', to: 'dwt', x: 915 },   // DWD ↔ DWT 之间
  { from: 'dwt', to: 'ads', x: 1365 },  // DWT ↔ ADS 之间
];
const GAP_X = Object.fromEntries(LANE_GAPS.map(g => [`${g.from}-${g.to}`, g.x]));

function getLaneX(layer) {
  return LANE_X[layer] !== undefined ? LANE_X[layer] : 24;
}

// 节点垂直居中（在同一 swimlane 内按节点数均分高度）
function layoutLane(byLane, laneX, topY, bottomY) {
  const nodes = byLane[laneX] || [];
  const count = nodes.length;
  if (count === 0) return;
  const h = bottomY - topY;
  const slot = h / count;
  nodes.forEach((n, i) => {
    n.x = LANE_X[laneX];
    n.y = topY + slot * i + (slot - NODE_H) / 2;
  });
}

// ====== 自动布局：barycenter 启发式 + 拓扑层级排序 ======
// 思路：
// 1. 第一轮：按 swimlane 分组，每组均匀分布
// 2. 反复迭代：每个节点计算"重心"（连接到对面列节点的平均 Y），按重心排序
// 3. 重新分配每列节点的 Y（用 barycenter 直接定位 + 解决重叠）
// 4. 优点：减少上下交叉，线更顺畅
function autoLayout() {
  const byLane = { ods: [], dwd: [], dwt: [], ads: [] };
  state.nodes.forEach(n => {
    if (byLane[n.layer]) byLane[n.layer].push(n);
  });

  const TOP_PAD = 80;
  const BOTTOM_PAD = 80;
  const GAP = 28;            // 节点间垂直间距（加大）
  const MIN_SPACING = NODE_H + GAP;
  // 根据节点总数动态计算：保证所有节点整齐分布
  const maxCount = Math.max(...LANE_DEFS.map(l => (byLane[l.key] || []).length), 1);
  const totalH = TOP_PAD + maxCount * NODE_H + (maxCount - 1) * GAP + BOTTOM_PAD;

  // === Round 0: 均匀分布 ===
  LANE_DEFS.forEach(lane => {
    const nodes = byLane[lane.key] || [];
    if (nodes.length === 0) return;
    const slot = (totalH - TOP_PAD - BOTTOM_PAD) / nodes.length;
    nodes.forEach((n, i) => {
      n.x = lane.x;
      n.y = TOP_PAD + slot * i + (slot - NODE_H) / 2;
    });
  });

  // === 反复迭代 barycenter（左右方向各做一次）===
  for (let iter = 0; iter < 4; iter++) {
    // 左→右：对每列（除第一列），按"前置列邻居的平均 Y"排序 + 定位
    for (let li = 1; li < LANE_DEFS.length; li++) {
      const nodes = byLane[LANE_DEFS[li].key];
      if (!nodes || nodes.length === 0) continue;
      // 计算每个节点的 barycenter
      nodes.forEach(n => {
        const inLinks = state.links.filter(l => l.target === n.id);
        if (inLinks.length === 0) {
          n._bary = n.y;
        } else {
          n._bary = inLinks.reduce((sum, l) => {
            const src = state.nodes.find(s => s.id === l.source);
            return sum + (src ? src.y + NODE_H / 2 : 0);
          }, 0) / inLinks.length;
        }
      });
      // 排序
      nodes.sort((a, b) => a._bary - b._bary);
      // 均匀定位（按排序结果，保留 barycenter 顺序）
      const slot = (totalH - TOP_PAD - BOTTOM_PAD) / nodes.length;
      nodes.forEach((n, i) => {
        n.x = LANE_DEFS[li].x;
        n.y = TOP_PAD + slot * i + (slot - NODE_H) / 2;
      });
    }
    // 右→左：对每列（除最后一列），按"后置列邻居的平均 Y"排序 + 定位
    for (let li = LANE_DEFS.length - 2; li >= 0; li--) {
      const nodes = byLane[LANE_DEFS[li].key];
      if (!nodes || nodes.length === 0) continue;
      nodes.forEach(n => {
        const outLinks = state.links.filter(l => l.source === n.id);
        if (outLinks.length === 0) {
          n._bary = n.y;
        } else {
          n._bary = outLinks.reduce((sum, l) => {
            const tgt = state.nodes.find(s => s.id === l.target);
            return sum + (tgt ? tgt.y + NODE_H / 2 : 0);
          }, 0) / outLinks.length;
        }
      });
      nodes.sort((a, b) => a._bary - b._bary);
      const slot = (totalH - TOP_PAD - BOTTOM_PAD) / nodes.length;
      nodes.forEach((n, i) => {
        n.x = LANE_DEFS[li].x;
        n.y = TOP_PAD + slot * i + (slot - NODE_H) / 2;
      });
    }
  }

  // 重新设置 SVG/容器 高度
  ['nodes', 'lineage-svg', 'canvas-grid', 'canvas-dot', 'lane-bg'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.minHeight = totalH + 'px';
  });
  return totalH;
}

function renderCanvas() {
  // 先按 swimlane 自动布局
  autoLayout();

  // 收集每个节点参与连接的字段（用于高亮显示）
  const connectedFields = {};
  state.nodes.forEach(n => connectedFields[n.id] = new Set());
  state.links.forEach(l => {
    if (l.sourceField) connectedFields[l.source]?.add(l.sourceField);

    wrap.insertBefore(bg, wrap.firstChild);
  }
  const totalH = autoLayout();
  bg.innerHTML = LANE_DEFS.map(l => {
    // 统计本 swimlane 节点数
    const cnt = state.nodes.filter(n => n.layer === l.key).length;

      </div>
    </div>`;
  }).join('');

  // 渲染节点
  const nodesContainer = document.getElementById('nodes');
  nodesContainer.innerHTML = state.nodes.map(n => {
    const t = DF.utils.findTable(n.id);
    if (!t) return '';
    // 字段排序：连接的字段（PK + 参与连线）放最前面，其他放后面
    const linked = connectedFields[n.id] || new Set();
    const sortedFields = [...t.fields].sort((a, b) => {
      const aLinked = (a.pk || linked.has(a.name)) ? 0 : 1;
      const bLinked = (b.pk || linked.has(b.name)) ? 0 : 1;
      return aLinked - bLinked;
    });
    const fields = sortedFields.slice(0, MAX_FIELDS_SHOW);
    const isActive = state.selected === n.id;
    return `<div class="node node--${n.layer} ${isActive ? 'node--active' : ''}" data-id="${n.id}" style="left: ${n.x}px; top: ${n.y}px; width: ${NODE_W}px; height: ${NODE_H}px; transform: scale(${state.zoom}); transform-origin: top left;">
      <div class="node__head">
        <span class="node__head-name" title="${t.name}">${t.name}</span>
        <span class="node__head-count">${t.fields.length}</span>
      </div>
      <div class="node__body">
        ${fields.map(f => {
          const isLinked = f.pk || linked.has(f.name);
          return `<div class="node__field ${f.pk ? 'node__field-pk' : f.fk ? 'node__field-fk' : ''} ${isLinked ? 'node__field--linked' : ''}" data-field="${f.name}">
            <span style="width: 14px; flex-shrink: 0; text-align: center; font-size: 10px;">${f.pk ? '🔑' : f.fk ? '🔗' : f.measure ? '∑' : ''}</span>
            <span style="font-family: var(--font-mono); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; ${isLinked ? 'color: var(--brand-700); font-weight: 600;' : 'color: var(--neutral-600);'}" title="${f.cn}">${f.name}</span>
            <span style="margin-left: auto; color: ${isLinked ? 'var(--brand-500)' : 'var(--neutral-400)'}; font-size: 9px; font-family: var(--font-mono);">${f.type.replace(/\(.*\)/, '')}</span>
          </div>`;
        }).join('')}
        ${t.fields.length > MAX_FIELDS_SHOW ? `<div class="node__field--more">+ ${t.fields.length - MAX_FIELDS_SHOW} 字段</div>` : ''}
      </div>
    </div>`;
  }).join('');

  // 渲染便签（受 toggle 控制，默认隐藏）
  if (state.showStickies) {
    nodesContainer.innerHTML += state.stickies.map((s, i) => `
      <div class="sticky" data-sticky="${i}" style="left: ${s.x}px; top: ${s.y}px; transform: scale(${state.zoom}) rotate(-2deg); transform-origin: top left;">
        <div style="white-space: pre-wrap;">${s.text}</div>
        <button class="btn btn--sm" style="position:absolute;top:4px;right:4px;padding:0 4px;background:rgba(0,0,0,.1);color:#92400E;border:none;" onclick="event.stopPropagation();removeSticky(${i})">×</button>
      </div>
    `).join('');
  }

  // 渲染连线
  renderLines();

  // 渲染画布信息
  document.getElementById('canvas-info').textContent = `${state.nodes.length} 模型 · ${state.links.length} 连线 · ${state.stickies.length} 便签 · v28`;

  // 节点拖拽 + 选中
  bindNodeEvents();
}

function renderLines() {
  const svg = document.getElementById('svg-lines');
  const labels = document.getElementById('svg-labels');
  svg.innerHTML = '';
  labels.innerHTML = '';

  // 按 (source, target) 分组，便于做束线
  const groups = {};
  state.links.forEach((l, i) => {
    const key = `${l.source}->${l.target}`;
    if (!groups[key]) groups[key] = { source: l.source, target: l.target, links: [] };
    groups[key].links.push({ ...l, _idx: i });
  });

  // 颜色映射
  const colorMap = {
    fk: '#5B85F8',
    pk: '#1E66F5',
    agg: '#F59E0B',
    flow: '#10B981',
  };

  // 索引节点快速查找
  const nodeById = {};
  state.nodes.forEach(n => { nodeById[n.id] = n; });

  // 处理每一组
  Object.values(groups).forEach(g => {
    const s = nodeById[g.source];
    const t = nodeById[g.target];
    if (!s || !t) return;
    if (s.x === t.x) return;

    const sTable = DF.utils.findTable(s.id);
    const tTable = DF.utils.findTable(t.id);
    if (!sTable || !tTable) return;

    const isHighlight = state.selected === s.id || state.selected === t.id;
    // 全局透明度：未选中时统一 0.85，选中时选中节点 1.0 其他 0.12
    const baseOpacity = state.selected === null
      ? 0.85
      : isHighlight ? 1 : 0.12;

    // ===== 收集所有 (sourceField Y, targetField Y) =====
    const lines = g.links.map(l => {
      const sy = fieldY(s, sTable, l.sourceField);
      const ty = fieldY(t, tTable, l.targetField);
      return {
        link: l,
        sy: sy >= 0 ? sy : nodeCenterY(s),
        ty: ty >= 0 ? ty : nodeCenterY(t),
        stroke: colorMap[l.type] || '#5B85F8',
      };
    });
    // 按 sy 排序，让上下分布开
    lines.sort((a, b) => a.sy - b.sy);

    // ===== 路由通道计算 =====
    const sourceRight = s.x + NODE_W;       // 起点 X（源节点右侧）
    const targetLeft  = t.x;                // 终点 X（目标节点左侧）
    const sourceLeft  = s.x;                // 起点 X（源节点左侧 — 反向连时用）

    // 判断层间距
    const sLaneIdx = LANE_DEFS.findIndex(l => l.key === s.layer);
    const tLaneIdx = LANE_DEFS.findIndex(l => l.key === t.layer);
    const laneGap = Math.abs(tLaneIdx - sLaneIdx);
    const goingRight = t.x > s.x;

    // 通道 X：跨几层跳几层。跨 1 层走中间通道，跨 2+ 层走顶层 (0) 或底层 (totalH)
    let channelX;
    let useTopRoute = false;
    if (laneGap === 1) {
      // 相邻泳道：使用中间预留通道
      const gapKey = `${s.layer}-${t.layer}`;
      const gapKeyRev = `${t.layer}-${s.layer}`;
      if (GAP_X[gapKey] !== undefined) {
        channelX = GAP_X[gapKey];
      } else if (GAP_X[gapKeyRev] !== undefined) {
        channelX = GAP_X[gapKeyRev];
      } else {
        channelX = Math.round((sourceRight + targetLeft) / 2);
      }
    } else {
      // 跨 2+ 层（e.g., ODS→DWD）：走顶部或底部绕行
      // 奇数跨层 -> 顶部，偶数跨层 -> 底部（避免重叠）
      useTopRoute = (laneGap % 2 === 0);
      // 从画布信息获取 totalH（autoLayout 返回值）
      const totalH = Math.max(svg.clientHeight || 1300, 1300);
      channelX = useTopRoute ? Math.round((sourceRight + targetLeft) / 2) : Math.round((sourceRight + targetLeft) / 2);
    }

    const groupType = lines[0].link.type || 'fk';

    // 绘制每条线（错位排列，避免重叠）
    lines.forEach((line, i) => {
      const { link, sy, ty, stroke } = line;
      const finalStroke = isHighlight ? '#1E66F5' : stroke;
      const finalWidth = isHighlight ? 2 : 1.5;
      const finalOpacity = baseOpacity;

      // 同通道多条线时，通道中间 Y 错位（避免重叠）
      // 错位间距 6px，上下一均分布
      const stagger = lines.length > 1 ? (i - (lines.length - 1) / 2) * 7 : 0;
      const midY1 = laneGap === 1 ? sy + stagger : sy;
      const midY2 = laneGap === 1 ? ty + stagger : ty;
      // 通道 X：相邻泳道多条线时也错位，使出口分开
      const chX = laneGap === 1 ? channelX + stagger * 0.6 : channelX;

      let pathD;
      if (laneGap === 1) {
        // 相邻泳道：走中间通道（正交折线，带错位）
        pathD = `M ${sourceRight} ${sy} L ${chX} ${midY1} L ${chX} ${midY2} L ${targetLeft} ${ty}`;
      } else {
        // 跨层：顶部/底部绕行（使用平滑贝塞尔曲线）
        const totalH = Math.max(svg.clientHeight || 1300, 1300);
        const routeY = useTopRoute ? 24 + stagger * 0.3 : totalH - 24 + stagger * 0.3;
        // 从源出发 → 向上/向下 → 横向 → 回来
        pathD = `M ${sourceRight} ${sy}
                 C ${chX} ${sy}, ${chX} ${routeY}, ${chX} ${routeY}
                 L ${targetLeft < chX ? targetLeft + 8 : targetLeft - 8} ${routeY}
                 C ${chX} ${routeY}, ${chX} ${ty}, ${targetLeft} ${ty}`;
      }

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathD);
      path.setAttribute('stroke', finalStroke);
      path.setAttribute('stroke-width', finalWidth);
      path.setAttribute('fill', 'none');
      path.setAttribute('marker-end', `url(#arrow-${groupType})`);
      path.setAttribute('opacity', finalOpacity);
      path.setAttribute('data-link-idx', link._idx);
      if (laneGap > 1) path.setAttribute('stroke-linecap', 'round');
      path.style.pointerEvents = 'stroke';
      path.style.cursor = 'pointer';
      path.addEventListener('click', () => {
        DF.app.toast(`${sTable.name}.${link.sourceField || '?'} → ${tTable.name}.${link.targetField || '?'} · ${link.label || ''}`, 'info');
      });
      // hover 高亮
      path.addEventListener('mouseenter', () => {
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('opacity', '1');
      });
      path.addEventListener('mouseleave', () => {
        path.setAttribute('stroke-width', finalWidth);
        path.setAttribute('opacity', finalOpacity);
      });
      svg.appendChild(path);
    });

    // ===== 标签 =====
    if (g.links.length <= 3) {
      // 少量线：每条都打标签（贴在水平段起点附近）
      lines.forEach((line, i) => {
        const labelText = line.link.label || '';
        if (!labelText) return;
        // 相邻泳道：标签贴起点附近；跨层：标签贴在顶部绕行 Y
        if (laneGap === 1) {
          drawLinkLabel(labels, sourceRight + 8, line.sy, labelText, line.stroke, baseOpacity);
        } else {
          const totalH = Math.max(svg.clientHeight || 1300, 1300);
          const routeY = useTopRoute ? 24 : totalH - 24;
          drawLinkLabel(labels, channelX - 30, routeY, labelText, line.stroke, baseOpacity);
        }
      });
    } else {
      // 多条线汇聚：合并标签
      const lbls = [...new Set(lines.map(l => l.link.label).filter(Boolean))];
      if (lbls.length > 0) {
        const labelText = lbls.length > 1
          ? `${lbls.length} 字段 · ${lbls.slice(0, 2).join(', ')}${lbls.length > 2 ? '…' : ''}`
          : lbls[0];
        // 标签放在汇聚点 channelX 附近，垂直居中
        const avgSy = lines.reduce((sum, l) => sum + l.sy, 0) / lines.length;
        const labelW = Math.min(140, labelText.length * 7 + 16);
        const labelX = channelX - labelW / 2;
        if (laneGap === 1) {
          drawLinkLabel(labels, labelX, avgSy, labelText, colorMap[groupType] || '#5B85F8', 0.95);
        } else {
          const totalH = Math.max(svg.clientHeight || 1300, 1300);
          const routeY = useTopRoute ? 24 : totalH - 24;
          drawLinkLabel(labels, labelX, routeY, labelText, colorMap[groupType] || '#5B85F8', 0.95);
        }
      }
    }
  });
}

// 辅助：画一个连线标签（白底圆角矩形 + 文字）
function drawLinkLabel(container, x, y, text, color, opacity) {
  const charW = 7;
  const labelText = text.length > 22 ? text.slice(0, 21) + '…' : text;
  const labelW = labelText.length * charW + 14;
  const labelH = 18;
  const labelY = y - labelH / 2;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x);
  rect.setAttribute('y', labelY);
  rect.setAttribute('width', labelW);
  rect.setAttribute('height', labelH);
  rect.setAttribute('rx', 4);
  rect.setAttribute('fill', '#fff');
  rect.setAttribute('stroke', color);
  rect.setAttribute('stroke-width', '1.2');
  rect.setAttribute('opacity', opacity);
  container.appendChild(rect);
  const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  textEl.setAttribute('x', x + labelW / 2);
  textEl.setAttribute('y', labelY + 12);
  textEl.setAttribute('text-anchor', 'middle');
  textEl.setAttribute('font-size', '10');
  textEl.setAttribute('fill', color);
  textEl.setAttribute('font-family', 'JetBrains Mono, monospace');
  textEl.setAttribute('font-weight', '600');
  textEl.setAttribute('opacity', opacity);
  textEl.textContent = labelText;
  container.appendChild(textEl);
}

function bindNodeEvents() {
  const wrap = document.getElementById('canvas-wrap');

  document.querySelectorAll('.node').forEach(node => {
    const id = node.dataset.id;

    node.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      selectNode(id);
      const startX = e.clientX;
      const startY = e.clientY;
      const n = state.nodes.find(x => x.id === id);
      const origX = n.x;
      const origY = n.y;
      const onMove = (e) => {
        const dx = (e.clientX - startX) / state.zoom;
        const dy = (e.clientY - startY) / state.zoom;
        n.x = Math.max(0, origX + dx);
        n.y = Math.max(0, origY + dy);
        node.style.left = n.x + 'px';
        node.style.top = n.y + 'px';
        renderLines();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        saveHistory();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    node.addEventListener('dblclick', () => {
      DF.app.go('05-table-detail.html?id=' + id);
    });
  });

  document.querySelectorAll('.sticky').forEach(el => {
    const idx = parseInt(el.dataset.sticky);
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      e.stopPropagation();
      dragging = true;
      sx = e.clientX; sy = e.clientY;
      ox = state.stickies[idx].x; oy = state.stickies[idx].y;
    });
    document.addEventListener('mousemove', (e) => {
      if (dragging) {
        state.stickies[idx].x = ox + (e.clientX - sx) / state.zoom;
        state.stickies[idx].y = oy + (e.clientY - sy) / state.zoom;
        el.style.left = state.stickies[idx].x + 'px';
        el.style.top = state.stickies[idx].y + 'px';
      }
    });
    document.addEventListener('mouseup', () => dragging = false);
  });
}

// 画布接收拖入
document.getElementById('canvas-wrap').addEventListener('dragover', (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});
document.getElementById('canvas-wrap').addEventListener('drop', (e) => {
  e.preventDefault();
  const tableId = e.dataTransfer.getData('text/plain');
  if (!tableId) return;
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const x = (e.clientX - rect.left + wrap.scrollLeft) / state.zoom - 100;
  const y = (e.clientY - rect.top + wrap.scrollTop) / state.zoom - 50;
  addNode(tableId, Math.max(0, x), Math.max(0, y));
});

function addNode(id, x, y) {
  if (state.nodes.find(n => n.id === id)) {
    DF.app.toast('该模型已在画布中', 'warning');
    return;
  }
  const t = DF.utils.findTable(id);
  if (!t) return;
  state.nodes.push({
    id,
    layer: t.layer,
    x: x !== undefined ? x : 100 + Math.random() * 600,
    y: y !== undefined ? y : 100 + Math.random() * 400,
    type: t.layer,
  });
  saveHistory();
  renderCanvas();
  renderLeftList();
  selectNode(id);
  DF.app.toast(`已添加 ${t.name}`, 'success');
}

function addSticky() {

    state.showStickies = true;
    saveHistory();
    renderCanvas();
    updateStickyToggleBtn();
    DF.app.toast('已添加便签', 'success');
  }
}

function toggleStickies() {
  state.showStickies = !state.showStickies;
  updateStickyToggleBtn();
  renderCanvas();
  DF.app.toast(state.showStickies ? '已显示便签' : '已隐藏便签', 'info', 1500);
}

function toggleCrossLayer() {
  state.showCrossLayer = !state.showCrossLayer;
  if (state.showCrossLayer) {
    // 添加跨层连线（避免重复）
    const existing = new Set(state.links.map(l => `${l.source}->${l.target}-${l.sourceField}-${l.targetField}`));
    state.crossLayerLinks.forEach(l => {
      const key = `${l.source}->${l.target}-${l.sourceField}-${l.targetField}`;
      if (!existing.has(key)) state.links.push(l);
    });
  } else {
    // 移除跨层连线
    const crossKeys = new Set(state.crossLayerLinks.map(l => `${l.source}->${l.target}-${l.sourceField}-${l.targetField}`));
    state.links = state.links.filter(l => {
      const key = `${l.source}->${l.target}-${l.sourceField}-${l.targetField}`;
      return !crossKeys.has(key);
    });
  }
  updateCrossLayerToggleBtn();
  renderCanvas();
  DF.app.toast(state.showCrossLayer ? '已显示跨层关系（ODS→DWD、DWD→DWT）' : '已隐藏跨层关系', 'info', 1500);
}

function updateCrossLayerToggleBtn() {
  const btn = document.getElementById('cross-layer-toggle-btn');
  if (btn) {
    if (state.showCrossLayer) btn.classList.add('active');
    else btn.classList.remove('active');
  }
}

function updateStickyToggleBtn() {
  const btn = document.getElementById('sticky-toggle-btn');
  if (btn) {
    if (state.showStickies) btn.classList.add('active');
    else btn.classList.remove('active');
  }
}

function removeSticky(idx) {
  state.stickies.splice(idx, 1);
  saveHistory();
  renderCanvas();
}

function removeNode(id) {
  state.nodes = state.nodes.filter(n => n.id !== id);
  state.links = state.links.filter(l => l.source !== id && l.target !== id);
  selectNode(null);
  saveHistory();
  renderCanvas();
  renderLeftList();
  DF.app.toast('已从画布移除', 'success');
}

function deleteSelected() {
  if (state.selected) {
    removeNode(state.selected);
  } else {
    DF.app.toast('请先选中元素', 'info');
  }
}

function zoom(delta) {
  state.zoom = Math.max(0.5, Math.min(2, state.zoom + delta));
  document.getElementById('zoom-pct').textContent = Math.round(state.zoom * 100) + '%';
  document.querySelectorAll('.node, .sticky').forEach(el => {
    el.style.transform = `scale(${state.zoom})${el.classList.contains('sticky') ? ' rotate(-2deg)' : ''}`;
  });
  renderLines();
}

function fitToScreen() {
  state.zoom = 1;
  document.getElementById('zoom-pct').textContent = '100%';
  document.querySelectorAll('.node, .sticky').forEach(el => {
    el.style.transform = `scale(1)${el.classList.contains('sticky') ? ' rotate(-2deg)' : ''}`;
  });
  renderLines();
  DF.app.toast('已重置视图', 'info');
}

function saveHistory() {
  state.history = state.history.slice(0, state.historyIdx + 1);
  state.history.push(JSON.parse(JSON.stringify({ nodes: state.nodes, links: state.links, stickies: state.stickies })));
  state.historyIdx = state.history.length - 1;
  if (state.history.length > 50) {
    state.history.shift();
    state.historyIdx--;
  }
}

function undo() {
  if (state.historyIdx > 0) {
    state.historyIdx--;
    restore();
    DF.app.toast('已撤销', 'info');
  }
}

function redo() {
  if (state.historyIdx < state.history.length - 1) {
    state.historyIdx++;
    restore();
    DF.app.toast('已重做', 'info');
  }
}

function restore() {
  const s = state.history[state.historyIdx];
  state.nodes = JSON.parse(JSON.stringify(s.nodes));
  state.links = JSON.parse(JSON.stringify(s.links));
  state.stickies = JSON.parse(JSON.stringify(s.stickies));
  renderCanvas();
  renderLeftList();
}
