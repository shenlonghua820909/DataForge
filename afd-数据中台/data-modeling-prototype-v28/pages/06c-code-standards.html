let currentCodebook = codebooks[0];

function renderTree() {
  document.getElementById('tree-body').innerHTML = codebooks.map(cb => `
    <div class="tree-cat">
      <div class="tree-cat__head ${cb.code === currentCodebook.code ? 'active' : ''}" onclick="selectCodebook('${cb.code}')">
        <span class="ico">${cb.icon}</span>
        <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${cb.cn}</span>
        <span class="count">${cb.codes.length}</span>
      </div>
    </div>
  `).join('');
  document.getElementById('cat-count').textContent = codebooks.length + ' 个码表';
}

function selectCodebook(code) {
  currentCodebook = codebooks.find(c => c.code === code);
  renderTree();
  renderDetail();
  renderCodes();
}

function renderDetail() {
  const cb = currentCodebook;
  document.getElementById('detail-head').innerHTML = `
    <div class="detail__title"><span class="ico">${cb.icon}</span> ${cb.code} <span style="font-size:13px; color:var(--neutral-500); font-weight:400; font-family:var(--font-mono);">${cb.en}</span></div>
    <div class="detail__sub">${cb.cn} · 来源：<span class="pill pill--pub" style="margin-left:4px;">${cb.source}</span></div>
    <div class="detail__stats">
      <div class="detail__stat"><b>${cb.codes.length}</b>码值</div>
      <div class="detail__stat"><b>${cb.codes.filter(c => c.def).length}</b>默认值</div>
      <div class="detail__stat"><b>${cb.refs.split('→')[1].trim()}</b>引用属性</div>
    </div>
    <div style="font-size: 12px; color: var(--neutral-600); line-height: 1.6; margin-top: 12px; padding: 10px 12px; background: #F8FAFF; border-radius: 6px; border-left: 3px solid var(--brand-500);">${cb.desc}</div>
  `;
}

function renderCodes() {
  const cb = currentCodebook;
  const search = document.getElementById('cv-search').value.toLowerCase();
  const filter = document.getElementById('cv-filter').value;
  const filtered = cb.codes.filter(c => {
    if (search && !(c.v.toLowerCase().includes(search) || c.cn.includes(search) || c.en.toLowerCase().includes(search) || (c.desc||'').includes(search))) return false;
    if (filter === 'default' && !c.def) return false;
    return true;
  });
  document.getElementById('cv-count').textContent = `共 ${filtered.length} / ${cb.codes.length} 条`;
  document.getElementById('cv-tbody').innerHTML = filtered.map(c => `
    <tr class="${c.def ? 'is-default' : ''}">
      <td class="text-mono" style="color:var(--brand-700); font-weight:600;">${c.v}</td>
      <td><b>${c.cn}</b></td>
      <td class="text-mono" style="color:var(--neutral-500); font-size:12px;">${c.en}</td>
      <td style="color: var(--neutral-600);">${c.desc || '—'}</td>
      <td>${c.def ? '<span class="pill pill--default">★ 默认</span>' : '—'}</td>
      <td><span class="pill pill--pub">生效</span></td>
      <td class="text-mono" style="color: var(--brand-500); font-size: 11px;">${cb.refs.split('→')[1].trim()}</td>
    </tr>
  `).join('');
}

// URL 参数 ?code=xxx 自动选中
const params = new URLSearchParams(location.search);
if (params.get('code')) selectCodebook(params.get('code'));
else { renderTree(); renderDetail(); renderCodes(); }
</script>
