<script>
const state = {
  center: DF.app.getQuery('center') || 'dwd_bib_unified',
  selected: null,
  zoom: 1,
  nodes: [],
  links: [],
};

// 中心节点位置
const centerX = 500, centerY = 280;

// 上游节点位置（左侧）
const upstreamLayout = {
  ods_bib_record: { x: 60, y: 100 },
  dwd_patron: { x: 60, y: 220 },
  dwd_bib: { x: 60, y: 360 },
  dwd_location: { x: 60, y: 480 },
  dwd_date: { x: 220, y: 60 },
  dwd_geo: { x: 220, y: 580 },
  dwd_channel: { x: 380, y: 60 },
};

// 下游节点位置（右侧）
const downstreamLayout = {
  dwt_loan_daily: { x: 880, y: 140 },
  dwt_patron_borrow_daily: { x: 880, y: 240 },
  dwt_shop_revenue_daily: { x: 880, y: 340 },
  ads_patron_profile: { x: 880, y: 440 },
  ads_bib_recommend: { x: 880, y: 540 },
  ads_report_daily: { x: 1020, y: 340 },
};

(function () {
  // 中心表
  const center = DF.utils.findTable(state.center);
  document.getElementById('center-table-name').textContent = center ? center.name : 'dwd_bib_unified';

  // 加载血缘数据
  const lin = DF.data.lineage[state.center] || { upstream: ['ods_bib_record', 'dwd_patron', 'dwd_bib', 'dwd_location', 'dwd_date'], downstream: ['dwt_loan_daily', 'dwt_patron_borrow_daily', 'ads_patron_profile'] };

  // 构造节点
  state.nodes = [];
  state.links = [];

  // 中心节点
  state.nodes.push({ id: state.center, x: centerX, y: centerY, center: true });

  // 上游
  lin.upstream.forEach(id => {
    const pos = upstreamLayout[id] || { x: 60, y: 200 + state.nodes.length * 80 };
    state.nodes.push({ id, x: pos.x, y: pos.y, upstream: true });
    state.links.push({ source: id, target: state.center, dir: 'up' });
  });

  // 下游
  lin.downstream.forEach(id => {
    const pos = downstreamLayout[id] || { x: 880, y: 200 + state.nodes.length * 80 };
    state.nodes.push({ id, x: pos.x, y: pos.y, downstream: true });
    state.links.push({ source: state.center, target: id, dir: 'down' });
  });

  // 统计
  document.getElementById('upstream-count').textContent = lin.upstream.length;
  document.getElementById('downstream-count').textContent = lin.downstream.length;
  document.getElementById('table-lineage-count').textContent = (lin.upstream.length + lin.downstream.length + 1);
  document.getElementById('metric-lineage-count').textContent = Math.floor(Math.random() * 12) + 5;

  // 渲染
  renderLineage();
  renderDefaultDetail();

  // 画布点击
  document.getElementById('lineage-canvas').addEventListener('click', (e) => {
    if (e.target === e.currentTarget || e.target.tagName === 'svg') {
      state.selected = null;
      document.querySelectorAll('.lineage-node').forEach(n => n.classList.remove('lineage-node--active'));
      document.getElementById('svg-lines').innerHTML = '';
      renderDefaultDetail();
    }
  });

  // 处理 ?dir= 参数
  const dir = DF.app.getQuery('dir');
  if (dir === 'up') highlightDirection('up');
  else if (dir === 'down') highlightDirection('down');
})();

function renderLineage() {
  const container = document.getElementById('lineage-nodes');
  container.innerHTML = state.nodes.map(n => {
    const t = DF.utils.findTable(n.id);
    if (!t) return '';
    return `<div class="lineage-node lineage-node--${t.layer} ${n.center ? 'lineage-node--active' : ''}" data-id="${n.id}" style="left: ${n.x}px; top: ${n.y}px; transform: scale(${state.zoom}); transform-origin: top left;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
        <span class="layer-tag layer-tag--${t.layer}" style="font-size: 9px; padding: 0 4px;">${t.layer.toUpperCase()}</span>
        ${t.status === 'published' ? '<span class="dot dot--success"></span>' : ''}
        ${n.upstream ? '<span style="color: var(--info-500); font-size: 9px;">↑ 上游</span>' : ''}
        ${n.downstream ? '<span style="color: var(--brand-500); font-size: 9px;">↓ 下游</span>' : ''}
        ${n.center ? '<span style="color: var(--warning-500); font-size: 9px;">★ 中心</span>' : ''}
      </div>
      <div class="text-mono" style="font-weight: 600; font-size: 12px; color: var(--neutral-800);">${t.name}</div>
      <div style="font-size: 10px; color: var(--neutral-500);">${t.cn}</div>
      <div style="font-size: 9px; color: var(--neutral-400); margin-top: 2px;">${DF.utils.formatNumber(t.rows)} · ${t.size}</div>
    </div>`;
  }).join('');

  // 节点点击
  container.querySelectorAll('.lineage-node').forEach(node => {
    node.addEventListener('click', (e) => {
      e.stopPropagation();
      state.selected = node.dataset.id;
      document.querySelectorAll('.lineage-node').forEach(n => n.classList.remove('lineage-node--active'));
      node.classList.add('lineage-node--active');
      renderLineLinks(node.dataset.id);
      renderNodeDetail(node.dataset.id);
    });

    node.addEventListener('dblclick', () => {
      DF.app.go('05-table-detail.html?id=' + node.dataset.id);
    });
  });

  renderLineLinks();
}

function renderLineLinks(focusId) {
  const svg = document.getElementById('svg-lines');
  svg.innerHTML = '';
  state.links.forEach(l => {
    const s = state.nodes.find(n => n.id === l.source);
    const t = state.nodes.find(n => n.id === l.target);
    if (!s || !t) return;

    const sx = s.x + 140 * state.zoom;
    const sy = s.y + 40 * state.zoom;
    const tx = t.x;
    const ty = t.y + 40 * state.zoom;

    const isActive = focusId && (l.source === focusId || l.target === focusId);
    const isFaded = focusId && !isActive;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${sx} ${sy} C ${(sx + tx) / 2} ${sy}, ${(sx + tx) / 2} ${ty}, ${tx} ${ty}`);
    path.setAttribute('stroke', isActive ? '#1E66F5' : (l.dir === 'up' ? '#0EA5E9' : '#1E66F5'));
    path.setAttribute('stroke-width', isActive ? '2.5' : '1.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('marker-end', isActive ? 'url(#arr-down-active)' : (l.dir === 'up' ? 'url(#arr-up)' : 'url(#arr-down)'));
    if (isFaded) path.setAttribute('opacity', '0.25');
    svg.appendChild(path);
  });
}

function highlightDirection(dir) {
  const nodes = document.querySelectorAll('.lineage-node');
  if (dir === 'up') {
    nodes.forEach(n => {
      if (n.dataset.id === state.center || n.classList.contains('lineage-node--dwd') || n.classList.contains('lineage-node--ods')) return;
      n.classList.add('lineage-node--faded');
    });
  } else if (dir === 'down') {
    nodes.forEach(n => {
      if (n.dataset.id === state.center || n.classList.contains('lineage-node--dwt') || n.classList.contains('lineage-node--ads')) return;
      n.classList.add('lineage-node--faded');
    });
  }
  DF.app.toast(`已仅显示${dir === 'up' ? '上游' : '下游'}血缘`, 'info');
}

function lineageZoom(delta) {
  state.zoom = Math.max(0.5, Math.min(2, state.zoom + delta));
  document.getElementById('lineage-zoom-pct').textContent = Math.round(state.zoom * 100) + '%';
  document.querySelectorAll('.lineage-node').forEach(el => el.style.transform = `scale(${state.zoom})`);
  renderLineLinks(state.selected);
}

function lineageFit() {
  state.zoom = 1;
  document.getElementById('lineage-zoom-pct').textContent = '100%';
  document.querySelectorAll('.lineage-node').forEach(el => el.style.transform = 'scale(1)');
  renderLineLinks(state.selected);
  DF.app.toast('已重置视图', 'info');
}

function renderDefaultDetail() {
  const center = DF.utils.findTable(state.center) || DF.utils.findTable('dwd_bib_unified');
  renderNodeDetail(center.id, true);
}

function renderNodeDetail(id, isCenter) {

        <div style="padding: 10px; background: var(--brand-50); border-radius: 6px; text-align: center;">

          <div style="font-size: 10px; color: var(--neutral-600);">下游引用</div>
        </div>
      </div>
      <div style="margin-top: 8px; padding: 8px 10px; background: ${(lin.upstream.length + lin.downstream.length) > 8 ? 'var(--warning-50)' : 'var(--success-50)'}; border-radius: 6px; font-size: 11px; color: ${(lin.upstream.length + lin.downstream.length) > 8 ? 'var(--warning-700)' : 'var(--success-700)'};">

    </div>

    <div style="padding: 16px; border-bottom: 1px solid var(--neutral-200);">
      <div style="font-size: 12px; font-weight: 600; color: var(--neutral-700); margin-bottom: 10px;">字段血缘（86 条）</div>
      <div style="display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto;">
        ${t.fields.filter(f => f.fk || f.measure).slice(0, 5).map(f => `
          <div style="padding: 6px 8px; background: var(--neutral-50); border-radius: 4px; font-size: 11px;">
            <div class="text-mono" style="color: var(--brand-700); font-weight: 500;">${f.name}</div>
            <div style="font-size: 10px; color: var(--neutral-500); margin-top: 2px;">
              ← ${f.fk ? f.fk : 'ods_bib_record.' + f.name} → ${(lin.downstream || []).slice(0, 2).map(d => d + '.' + f.name).join(', ')}

          </div>
        `).join('')}
        <a style="text-align: center; font-size: 11px; color: var(--brand-500); margin-top: 4px; cursor: pointer;" onclick="DF.app.modal({title:'字段血缘详情',body:'<p>共 86 条字段血缘，点击查看完整链路</p>',actions:'<button class=\\'btn btn--primary\\' data-resolve>关闭</button>'})">展开全部 86 条字段血缘 →</a>
      </div>
    </div>

    <div style="padding: 16px;">
      <div style="font-size: 12px; font-weight: 600; color: var(--neutral-700); margin-bottom: 10px;">快捷操作</div>
      <div style="display: flex; flex-direction: column; gap: 6px;">

      </div>

}
</script>
