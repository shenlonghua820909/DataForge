let activeQuick = 'all';

function quickFilter(el) {
  document.querySelectorAll('.filter-bar__chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeQuick = el.dataset.quick;
  applyFilter();
}

function applyFilter() {
  const fEntity = document.getElementById('f-entity').value;
  const fType = document.getElementById('f-type').value;
  const fSearch = document.getElementById('f-search').value.toLowerCase();
  const filtered = attrPool.filter(a => {
    if (fEntity && a.entity !== fEntity) return false;
    if (fType && !a.type.startsWith(fType)) return false;
    if (fSearch && !(a.code.toLowerCase().includes(fSearch) || a.cn.includes(fSearch) || a.en.toLowerCase().includes(fSearch))) return false;
    if (activeQuick === 'req' && !a.req) return false;
    if (activeQuick === 'pk' && !a.code.endsWith('_id') && a.code !== 'std_barcode' && a.code !== 'std_call_no') return false;
    if (activeQuick === 'code' && !a.code_ref) return false;
    return true;
  });
  document.getElementById('f-count').textContent = `共 ${filtered.length} 条`;
  document.getElementById('attr-tbody').innerHTML = filtered.map(a => `
    <tr onclick="showDetail('${a.code}')">
      <td class="text-mono" style="color:var(--brand-700); font-weight:500;">${a.code}</td>
      <td><b>${a.cn}</b></td>
      <td class="text-mono" style="color:var(--neutral-500); font-size:12px;">${a.en}</td>
      <td><span class="type-tag type-${a.type.replace(/[\\(\\d,)]/g, '')}">${a.type}</span></td>
      <td class="text-mono" style="color:var(--neutral-500); font-size:11px;">${a.regex || '—'}</td>
      <td>${a.req ? '<span class="pill pill--req">必填</span>' : '—'}</td>
      <td>${a.code_ref ? '<span class="pill pill--code">' + a.code_ref + '</span>' : '—'}</td>
      <td><span class="ref-link" onclick="event.stopPropagation(); DF.app.go('06a-entity-standards.html?entity=' + '${a.entity}')">${entityNames[a.entity] || a.entity} (${a.entity})</span></td>
      <td style="text-align: right; font-family: var(--font-mono); color: var(--brand-500);">${refCounts[a.entity] || 0}</td>
    </tr>
  `).join('');
}

function showDetail(code) {
  const a = attrPool.find(x => x.code === code);
  if (!a) return;
  const exampleValues = a.type.startsWith('STRING') ? ['9787100001234', '978-7-100-12345-6'] : a.type === 'DATE' ? ['2024-01-15', '2024-12-31'] : a.type === 'INT' ? ['1', '365', '10000'] : ['...'];
  DF.app.modal({
    title: '📋 ' + a.code + '  ·  ' + a.cn,
    width: 640,
    body: `
      <div style="line-height: 1.8; font-size: 13px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 16px;">
          <div><span style="color:var(--neutral-500);">英文名：</span><span class="text-mono">${a.en}</span></div>
          <div><span style="color:var(--neutral-500);">数据类型：</span><span class="type-tag type-${a.type.replace(/[\\(\\d,)]/g, '')}">${a.type}</span></div>
          <div><span style="color:var(--neutral-500);">必填：</span>${a.req ? '<span class="pill pill--req">是</span>' : '否'}</div>
          <div><span style="color:var(--neutral-500);">所属实体：</span>${entityNames[a.entity] || a.entity}</div>
          <div><span style="color:var(--neutral-500);">引用次数：</span>${refCounts[a.entity] || 0} 张表</div>
          <div><span style="color:var(--neutral-500);">标准来源：</span>${a.source}</div>
          <div style="grid-column: span 2;"><span style="color:var(--neutral-500);">校验规则：</span><code class="text-mono" style="background:var(--neutral-50); padding: 2px 6px; border-radius: 3px; font-size: 11px;">${a.regex || '无'}</code></div>
          <div style="grid-column: span 2;"><span style="color:var(--neutral-500);">说明：</span>${a.desc}</div>
        </div>
        <div style="background: var(--brand-50); padding: 10px 12px; border-radius: 6px; margin-bottom: 12px;">
          <div style="font-size: 12px; font-weight: 600; color: var(--brand-700); margin-bottom: 4px;">示例值</div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            ${exampleValues.map(v => '<code class="text-mono" style="background: #fff; padding: 3px 8px; border-radius: 3px; font-size: 11px; border: 1px solid var(--brand-200);">' + v + '</code>').join('')}
          </div>
        </div>
        ${a.code_ref ? `<div style="background: #FEF3C7; padding: 8px 12px; border-radius: 6px; font-size: 12px;">📋 引用码值标准：<a class="ref-link" onclick="DF.app.go('06c-code-standards.html?code=${a.code_ref}')">${a.code_ref}</a></div>` : ''}
      </div>
    `,
    actions: '<button class="btn" data-resolve>关闭</button><button class="btn btn--primary" onclick="DF.stdModals.fieldStats(\'std_bib_isbn\')">查看引用表</button>'
  });
}

applyFilter();
</script>

<script>
function openAttributeSearch() {
  const all = [
    'std_bib_isbn ISBN（13 位） — STRING(13) / 引用 12 张表',
    'std_bib_issn ISSN — STRING(8) / 引用 5 张表',
    'std_bib_title 正题名 — STRING(500) / 必填 / 引用 12 张表',
    'std_bib_clc 中图法分类号 — STRING(20) / 引用 10 张表',
    'std_bib_language 语种 (ISO 639) — CODE / 引用 8 张表',
    'std_author_name 作者姓名 — STRING(100) / 必填 / 引用 18 张表',
    'std_publisher 出版社 — STRING(200) / 引用 6 张表',
    'std_publication_year 出版年 — INT / 引用 12 张表',
    'std_callno 索书号 — STRING(50) / 必填 / 引用 4 张表',
    'std_location 馆藏地点 — CODE / 引用 8 张表',
    'std_loan_status 流通状态 — CODE / 引用 6 张表',
    'std_reader_type 读者类型 — CODE / 引用 4 张表',
    'std_subject 主题词 — STRING(500) / 引用 12 张表',
    'std_doc_type 文献类型 — CODE / 引用 6 张表',
    'std_money 金额 — DECIMAL(18,2) / 引用 5 张表',
  ];
  DF.stdModals.search('属性', '输入编码、中文名...', all, (item) => {
    const m = item.match(/^(\S+)/);
    if (m) DF.app.toast(`✓ 跳转到 ${m[1]} 详情`, 'success');
  });
}
</script>

</script>
